name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Java version could not be detected."
            exit 1
          fi
          echo "Active Java major version: $JAVA_VER"
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Active Java major version ($JAVA_VER) is lower than 17."
            exit 1
          fi
          echo "Java major version ($JAVA_VER) is 17 or newer."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          else
            echo "debug.keystore is missing. Generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore."
            exit 1
          fi
          echo "./debug.keystore is present and ready."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK not found at $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is empty."
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "Error: $EXPECTED_APK does not have .apk extension."
            exit 1
          fi

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Selected APK does not match expected path."
            exit 1
          fi

          echo "APK verification successful: $EXPECTED_APK exists and is a valid non-empty APK file."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR="${RUNNER_TEMP:-/tmp}/release-asset-temp"
          mkdir -p "$ASSET_DIR"

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO=$(echo "$REPO_NAME" | tr -cs 'a-zA-Z0-9_-' '-' | sed 's/^-//;s/-$//')
          FILENAME="${SANITIZED_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          DEST_PATH="${ASSET_DIR}/${FILENAME}"

          cp app/build/outputs/apk/debug/app-debug.apk "$DEST_PATH"

          echo "asset_path=${DEST_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Release asset prepared at: ${DEST_PATH}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSET: ${{ steps.prepare_asset.outputs.asset_path }}
        run: |
          set -e
          gh --version || { echo "::warning::GitHub CLI is not available"; exit 1; }

          if [ ! -f "$RELEASE_ASSET" ] || [ ! -s "$RELEASE_ASSET" ] || [[ "$RELEASE_ASSET" != *.apk ]]; then
            echo "::warning::Release asset validation failed for $RELEASE_ASSET"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES_FILE="${RUNNER_TEMP:-/tmp}/release_notes.md"
          cat <<EOF > "$NOTES_FILE"
          ### Debug APK Build #${GITHUB_RUN_NUMBER}

          - This is an automatically generated debug APK.
          - The APK was built by GitHub Actions.
          - The GitHub Actions run number: ${GITHUB_RUN_NUMBER}
          - The GitHub Actions run attempt: ${GITHUB_RUN_ATTEMPT}
          - The source commit SHA: ${GITHUB_SHA}
          - The APK is intended for testing.
          - The APK is not a Play Store production release.
          - The APK is signed only with a temporary debug keystore.
          EOF

          echo "Publishing GitHub Release $RELEASE_TAG..."
          gh release create "$RELEASE_TAG" "$RELEASE_ASSET" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --target "$GITHUB_SHA" \
            --latest || {
              echo "::warning::Failed to publish release with gh CLI; uploaded Actions artifact remains available."
              exit 1
            }

          echo "GitHub Release published successfully."
